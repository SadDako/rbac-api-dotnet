services:
  postgres:
    image: postgres:16-alpine
    container_name: rbac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rbac}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rbac}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rbac-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: src/Rbac.Api/Dockerfile
    container_name: rbac-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-rbac};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: "redis:6379"
      Jwt__Key: ${Jwt__Key:?Jwt__Key is required}
      Jwt__Issuer: ${Jwt__Issuer:-Rbac.Api}
      Jwt__Audience: ${Jwt__Audience:-Rbac.Api}
      Jwt__AccessTokenExpiresMinutes: ${Jwt__AccessTokenExpiresMinutes:-15}
      Jwt__RefreshTokenExpiresDays: ${Jwt__RefreshTokenExpiresDays:-7}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

volumes:
  pgdata:
  redisdata:
